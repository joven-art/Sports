<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameZone Scores</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050a0f;
    --surface: #0a1520;
    --surface2: #0f1f30;
    --border: #1a3a5c;
    --accent: #00d4ff;
    --accent2: #ff6b00;
    --accent3: #00ff88;
    --text: #e0f0ff;
    --muted: #5a8aaa;
    --danger: #ff3366;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
    background-size: 50px 50px;
    animation: gridShift 20s linear infinite;
    pointer-events: none;
    z-index: 0;
  }

  @keyframes gridShift {
    0% { background-position: 0 0; }
    100% { background-position: 50px 50px; }
  }

  /* Glow orbs */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.15;
    pointer-events: none;
    z-index: 0;
  }
  .orb1 { width: 400px; height: 400px; background: var(--accent); top: -100px; left: -100px; animation: float 8s ease-in-out infinite; }
  .orb2 { width: 300px; height: 300px; background: var(--accent2); bottom: -80px; right: -80px; animation: float 10s ease-in-out infinite reverse; }
  .orb3 { width: 200px; height: 200px; background: var(--accent3); top: 50%; left: 50%; animation: float 12s ease-in-out infinite 2s; }

  @keyframes float {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(30px, -30px); }
  }

  /* Layout */
  .wrapper { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 0 20px; }

  /* Header */
  header {
    text-align: center;
    padding: 50px 20px 30px;
    position: relative;
  }

  .logo {
    font-family: 'Orbitron', monospace;
    font-size: clamp(28px, 6vw, 52px);
    font-weight: 900;
    letter-spacing: 4px;
    background: linear-gradient(135deg, var(--accent), var(--accent3), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
    animation: logoGlow 3s ease-in-out infinite;
  }

  @keyframes logoGlow {
    0%, 100% { filter: drop-shadow(0 0 10px rgba(0, 212, 255, 0.5)); }
    50% { filter: drop-shadow(0 0 25px rgba(0, 255, 136, 0.7)); }
  }

  .tagline {
    color: var(--muted);
    font-size: 14px;
    letter-spacing: 6px;
    text-transform: uppercase;
    margin-top: 8px;
  }

  /* Game tabs */
  .game-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    padding: 30px 20px 20px;
  }

  .tab {
    padding: 10px 20px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.25s;
    position: relative;
    overflow: hidden;
    border-radius: 4px;
  }

  .tab::before {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent3));
    transform: scaleX(0);
    transition: transform 0.25s;
  }

  .tab:hover, .tab.active {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--surface2);
  }

  .tab:hover::before, .tab.active::before { transform: scaleX(1); }

  .tab .tab-icon { font-size: 18px; display: block; margin-bottom: 4px; }

  /* Main grid */
  .main-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    padding: 20px;
  }

  @media (max-width: 768px) {
    .main-grid { grid-template-columns: 1fr; }
  }

  /* Cards */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    position: relative;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent3), var(--accent2));
  }

  .card-header {
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .card-title {
    font-family: 'Orbitron', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--accent);
    text-transform: uppercase;
  }

  .card-body { padding: 20px; }

  /* Form */
  .form-group { margin-bottom: 16px; }

  label {
    display: block;
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 8px;
    font-weight: 600;
  }

  input, select, textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    font-weight: 500;
    padding: 10px 14px;
    border-radius: 4px;
    outline: none;
    transition: border-color 0.2s;
  }

  input:focus, select:focus, textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(0, 212, 255, 0.1);
  }

  select option { background: var(--bg); }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .btn {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, var(--accent), rgba(0, 212, 255, 0.6));
    border: none;
    color: #000;
    font-family: 'Orbitron', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 4px;
    margin-top: 8px;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 25px rgba(0, 212, 255, 0.4);
  }

  .btn:active { transform: translateY(0); }

  /* Live feed / scoreboard */
  .scores-list { display: flex; flex-direction: column; gap: 1px; }

  .score-item {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    background: var(--surface2);
    border-radius: 4px;
    margin-bottom: 6px;
    transition: all 0.2s;
    animation: slideIn 0.4s ease-out;
    position: relative;
    overflow: hidden;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-15px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .score-item:hover { border-left: 2px solid var(--accent); padding-left: 14px; }

  .rank {
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    width: 28px;
    flex-shrink: 0;
  }

  .rank-1 { color: #ffd700; }
  .rank-2 { color: #c0c0c0; }
  .rank-3 { color: #cd7f32; }

  .game-badge {
    font-size: 18px;
    width: 32px;
    flex-shrink: 0;
    text-align: center;
  }

  .score-info { flex: 1; min-width: 0; margin: 0 10px; }

  .score-player {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .score-meta {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    gap: 8px;
    margin-top: 2px;
  }

  .score-value {
    font-family: 'Orbitron', monospace;
    font-size: 16px;
    font-weight: 900;
    color: var(--accent);
    flex-shrink: 0;
  }

  .score-time {
    font-size: 11px;
    color: var(--muted);
    text-align: right;
    flex-shrink: 0;
    margin-left: 8px;
  }

  /* Filter bar */
  .filter-bar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }

  .filter-btn {
    padding: 6px 14px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-family: 'Rajdhani', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.2s;
  }

  .filter-btn:hover, .filter-btn.active {
    border-color: var(--accent2);
    color: var(--accent2);
    background: rgba(255, 107, 0, 0.05);
  }

  /* Stats row */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
    text-align: center;
  }

  .stat-val {
    font-family: 'Orbitron', monospace;
    font-size: 22px;
    font-weight: 900;
    color: var(--accent3);
  }

  .stat-label {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* Toast notification */
  #toast {
    position: fixed;
    bottom: 30px;
    right: 30px;
    background: var(--surface2);
    border: 1px solid var(--accent3);
    border-left: 4px solid var(--accent3);
    color: var(--text);
    padding: 14px 20px;
    border-radius: 4px;
    font-size: 14px;
    font-weight: 600;
    z-index: 1000;
    transform: translateX(150%);
    transition: transform 0.3s ease;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  #toast.show { transform: translateX(0); }

  /* Live indicator */
  .live-dot {
    width: 8px; height: 8px;
    background: var(--danger);
    border-radius: 50%;
    display: inline-block;
    animation: pulse 1.5s ease-in-out infinite;
    margin-right: 6px;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
    font-size: 14px;
    letter-spacing: 1px;
  }

  .empty-state .empty-icon { font-size: 40px; margin-bottom: 12px; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .scores-scroll { max-height: 420px; overflow-y: auto; padding-right: 4px; }

  footer {
    text-align: center;
    padding: 30px;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-top: 1px solid var(--border);
    margin-top: 40px;
  }
</style>
</head>
<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<div class="wrapper">
  <header>
    <div class="logo">⚡ GAMEZONE SCORES</div>
    <div class="tagline">Live Public Scoreboard · All Games · All Players</div>
  </header>

  <!-- Stats -->
  <div class="stats-row" style="padding: 0 20px;">
    <div class="stat-card">
      <div class="stat-val" id="totalScores">0</div>
      <div class="stat-label">Scores Posted</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="totalPlayers">0</div>
      <div class="stat-label">Players</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="topScore">—</div>
      <div class="stat-label">Top Score</div>
    </div>
  </div>

  <div class="main-grid">

    <!-- Upload Form -->
    <div class="card">
      <div class="card-header">
        <span>🎮</span>
        <span class="card-title">Post Your Score</span>
      </div>
      <div class="card-body">
        <div class="form-group">
          <label>Player Name</label>
          <input type="text" id="playerName" placeholder="Enter your name..." maxlength="30">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Game</label>
            <select id="gameSelect">
              <option value="">Select game...</option>
              <option value="cricket">🏏 Cricket</option>
              <option value="football">⚽ Football</option>
              <option value="efootball">🎮 eFootball</option>
              <option value="ludo">🎲 Ludo</option>
              <option value="bgmi">🔫 BGMI</option>
              <option value="freefire">🔥 Free Fire</option>
            </select>
          </div>
          <div class="form-group">
            <label>Score / Result</label>
            <input type="text" id="scoreInput" placeholder="e.g. 450 runs / 12 kills">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Mode / Match</label>
            <input type="text" id="modeInput" placeholder="e.g. Squad, 1v1, T20...">
          </div>
          <div class="form-group">
            <label>Rank / Position</label>
            <input type="text" id="rankInput" placeholder="e.g. #1, Booyah!">
          </div>
        </div>
        <div class="form-group">
          <label>Note (optional)</label>
          <input type="text" id="noteInput" placeholder="Any match details...">
        </div>
        <button class="btn" onclick="submitScore()">🚀 POST SCORE PUBLICLY</button>
      </div>
    </div>

    <!-- Live Scoreboard -->
    <div class="card">
      <div class="card-header">
        <span class="live-dot"></span>
        <span class="card-title">Live Scoreboard</span>
      </div>
      <div class="card-body">
        <div class="filter-bar" id="filterBar">
          <button class="filter-btn active" onclick="filterScores('all', this)">All</button>
          <button class="filter-btn" onclick="filterScores('cricket', this)">🏏</button>
          <button class="filter-btn" onclick="filterScores('football', this)">⚽</button>
          <button class="filter-btn" onclick="filterScores('efootball', this)">🎮</button>
          <button class="filter-btn" onclick="filterScores('ludo', this)">🎲</button>
          <button class="filter-btn" onclick="filterScores('bgmi', this)">🔫</button>
          <button class="filter-btn" onclick="filterScores('freefire', this)">🔥</button>
        </div>
        <div class="scores-scroll">
          <div class="scores-list" id="scoresList">
            <div class="empty-state">
              <div class="empty-icon">🏆</div>
              <div>No scores yet. Be the first to post!</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<footer>GameZone Scores · Open to all players · Post your scores publicly</footer>

<div id="toast">✅ Score posted successfully!</div>

<script>
  const GAME_ICONS = {
    cricket: '🏏',
    football: '⚽',
    efootball: '🎮',
    ludo: '🎲',
    bgmi: '🔫',
    freefire: '🔥'
  };

  const GAME_NAMES = {
    cricket: 'Cricket',
    football: 'Football',
    efootball: 'eFootball',
    ludo: 'Ludo',
    bgmi: 'BGMI',
    freefire: 'Free Fire'
  };

  let scores = JSON.parse(localStorage.getItem('gameZoneScores') || '[]');
  let currentFilter = 'all';

  // Seed some demo data if empty
  if (scores.length === 0) {
    scores = [
      { id: 1, player: 'Rahul_Gaming', game: 'bgmi', score: '23 Kills', mode: 'Squad', rank: '#1 Chicken Dinner', note: '', time: Date.now() - 60000 * 5 },
      { id: 2, player: 'SK_Striker', game: 'freefire', score: '18 Kills', mode: 'Clash Squad', rank: 'Booyah!', note: 'Insane game!', time: Date.now() - 60000 * 12 },
      { id: 3, player: 'CricketKing99', game: 'cricket', score: '156 runs', mode: 'T20', rank: 'Player of Match', note: '10 fours 3 sixes', time: Date.now() - 60000 * 20 },
      { id: 4, player: 'GoldenBoot07', game: 'football', score: '4 - 1', mode: 'Online Match', rank: 'Win', note: 'Hatrick!', time: Date.now() - 60000 * 35 },
      { id: 5, player: 'LudoMaster', game: 'ludo', score: '450 pts', mode: '4 Players', rank: '1st', note: '', time: Date.now() - 60000 * 50 },
    ];
    save();
  }

  function save() {
    localStorage.setItem('gameZoneScores', JSON.stringify(scores));
  }

  function timeAgo(ts) {
    const diff = (Date.now() - ts) / 1000;
    if (diff < 60) return 'Just now';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    return Math.floor(diff / 86400) + 'd ago';
  }

  function renderScores() {
    const list = document.getElementById('scoresList');
    const filtered = currentFilter === 'all' ? scores : scores.filter(s => s.game === currentFilter);
    const sorted = [...filtered].sort((a, b) => b.time - a.time);

    updateStats();

    if (sorted.length === 0) {
      list.innerHTML = `<div class="empty-state"><div class="empty-icon">🏆</div><div>No scores for this game yet!</div></div>`;
      return;
    }

    list.innerHTML = sorted.map((s, i) => {
      const rankClass = i === 0 ? 'rank-1' : i === 1 ? 'rank-2' : i === 2 ? 'rank-3' : '';
      return `
        <div class="score-item">
          <div class="rank ${rankClass}">#${i + 1}</div>
          <div class="game-badge">${GAME_ICONS[s.game]}</div>
          <div class="score-info">
            <div class="score-player">${escHtml(s.player)}</div>
            <div class="score-meta">
              <span>${GAME_NAMES[s.game]}</span>
              ${s.mode ? `<span>· ${escHtml(s.mode)}</span>` : ''}
              ${s.rank ? `<span>· ${escHtml(s.rank)}</span>` : ''}
            </div>
            ${s.note ? `<div style="font-size:12px;color:#5a8aaa;margin-top:3px">${escHtml(s.note)}</div>` : ''}
          </div>
          <div class="score-value">${escHtml(s.score)}</div>
          <div class="score-time">${timeAgo(s.time)}</div>
        </div>`;
    }).join('');
  }

  function updateStats() {
    const players = new Set(scores.map(s => s.player)).size;
    document.getElementById('totalScores').textContent = scores.length;
    document.getElementById('totalPlayers').textContent = players;

    // Try to find numeric top score
    let top = '—';
    const nums = scores
      .map(s => parseFloat(s.score.replace(/[^0-9.]/g, '')))
      .filter(n => !isNaN(n));
    if (nums.length) top = Math.max(...nums).toLocaleString();
    document.getElementById('topScore').textContent = top;
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function submitScore() {
    const player = document.getElementById('playerName').value.trim();
    const game = document.getElementById('gameSelect').value;
    const score = document.getElementById('scoreInput').value.trim();
    const mode = document.getElementById('modeInput').value.trim();
    const rank = document.getElementById('rankInput').value.trim();
    const note = document.getElementById('noteInput').value.trim();

    if (!player) { alert('Please enter your player name!'); return; }
    if (!game) { alert('Please select a game!'); return; }
    if (!score) { alert('Please enter your score!'); return; }

    scores.unshift({
      id: Date.now(),
      player, game, score, mode, rank, note,
      time: Date.now()
    });

    save();
    renderScores();
    showToast(`${GAME_ICONS[game]} Score posted! Good game, ${player}!`);

    // Reset form
    document.getElementById('playerName').value = '';
    document.getElementById('gameSelect').value = '';
    document.getElementById('scoreInput').value = '';
    document.getElementById('modeInput').value = '';
    document.getElementById('rankInput').value = '';
    document.getElementById('noteInput').value = '';
  }

  function filterScores(game, btn) {
    currentFilter = game;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderScores();
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3500);
  }

  // Auto-refresh timestamps every 30 seconds
  setInterval(renderScores, 30000);

  renderScores();
</script>
</body>
</html>
